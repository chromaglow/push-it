name: Bug report
description: Something about push-it isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you typed, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Plugin (/plugin install), Fallback installer (install.cmd / install.command), Not sure]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15.3, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Run `claude --version`
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Hook test output (optional)
      description: Paste the output of the "Test the hook by hand" command in docs/TROUBLESHOOTING.md.
      render: text
