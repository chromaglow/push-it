# push-it settings. One key=value per line; lines starting with # are ignored.
# To customize, copy this file to ~/.claude/push-it/push-it.conf and edit the copy;
# plugin updates replace this one.

# The exact line Claude opens its reply with.
reply=Push it real good.

# false: push only; if there are uncommitted changes, Claude says so and offers to commit.
# true:  Claude commits uncommitted changes with a short message, then pushes.
auto_commit=false

# A message fires only if it is a single line, starts with "push", has at most
# max_words words, and every word after "push" is in allowed_words.
# "two" and "too" are there because voice dictation often hears "to" that way.
max_words=6
allowed_words=it to two too that this these them the my our your changes change everything up main master branch github origin remote all now please real good em its code work commits
